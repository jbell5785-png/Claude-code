<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Race Music Lab</title>
<style>
  :root { --bg:#0b0d12; --panel:#141821; --fg:#e9edf5; --dim:#8b93a7; --acc:#ff3d6e; --acc2:#28e0ff; --line:rgba(255,255,255,.09); }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:880px; margin:0 auto; padding:20px 16px 40px; display:grid; gap:16px; }
  h1 { font-size:20px; margin:0; letter-spacing:.5px; }
  h1 span { color:var(--acc); }
  p.lead { margin:4px 0 0; color:var(--dim); }
  .grid { display:grid; grid-template-columns: minmax(0,1fr) minmax(0,300px); gap:16px; }
  @media (max-width:700px){ .grid { grid-template-columns: 1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .panel h2 { font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); margin:0 0 10px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  button { font:inherit; color:var(--fg); background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14); border-radius:7px; padding:7px 12px; cursor:pointer; }
  button:hover { background:rgba(255,255,255,.13); }
  button.on { border-color:var(--acc); color:var(--acc); }
  button.go { background:var(--acc); border-color:var(--acc); color:#fff; font-weight:700; }
  input[type=range] { accent-color:var(--acc); flex:1; min-width:120px; }
  canvas { width:100%; height:120px; display:block; border-radius:8px; background:#07080c; }
  #lights { font:800 44px/1 system-ui,sans-serif; text-align:center; height:52px; letter-spacing:2px; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:2px 12px; color:var(--dim); font-size:13px; }
  .kv b { color:var(--fg); font-weight:600; }
</style>
</head>
<body>
<main>
  <div>
    <h1>Race Music <span>Lab</span></h1>
    <p class="lead">Procedural drum &amp; bass, big beat, 2-step garage and acid, synthesised live with Web Audio. Press play, then drive the race states.</p>
  </div>
  <div class="grid">
    <div class="panel">
      <h2>Race state</h2>
      <div class="row" id="states"></div>
      <div id="lights" aria-live="polite"></div>
      <div class="row">
        <button class="go" id="race">Start race (3-2-1-GO)</button>
        <button id="drop">cueDrop()</button>
        <button id="next">Next song</button>
      </div>
      <h2 style="margin-top:14px">Intensity <span id="ival">0.70</span></h2>
      <div class="row"><input type="range" id="intensity" min="0" max="1" step="0.01" value="0.7" aria-label="Intensity"></div>
      <h2 style="margin-top:14px">Output</h2>
      <canvas id="scope" width="800" height="200"></canvas>
    </div>
    <div class="panel">
      <h2>Player widget</h2>
      <div id="widget"></div>
      <h2 style="margin-top:14px">Song</h2>
      <div class="kv" id="info"><span>title</span><b>–</b></div>
    </div>
  </div>
</main>
<script type="module" src="./demo.js"></script>
</body>
</html>
