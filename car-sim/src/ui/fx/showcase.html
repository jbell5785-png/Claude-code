<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FX Showcase</title>
  <style>
    :root { --bg: #07080c; --fg: #e8ecf4; --panel: rgba(10, 12, 18, 0.72); --accent: #29e7ff; --line: rgba(255, 255, 255, 0.12); }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; font: 12px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #view { display: block; width: 100vw; height: 100vh; }
    #ui { position: fixed; left: 12px; top: 12px; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; max-width: calc(100vw - 48px); }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 3px 0; }
    .row span { width: 52px; opacity: 0.6; text-transform: uppercase; letter-spacing: 0.06em; font-size: 10px; }
    button { background: transparent; color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 3px 7px; cursor: pointer; font: inherit; }
    button:hover { border-color: var(--accent); color: var(--accent); }
    .stat { margin-top: 6px; opacity: 0.7; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="ui" hidden></div>
  <script type="module" src="./showcase.js"></script>
</body>
</html>
