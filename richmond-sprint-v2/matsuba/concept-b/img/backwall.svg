<svg xmlns="http://www.w3.org/2000/svg" width="48" height="720" viewBox="0 0 48 720">
  <!-- One module of the back layer: a square-section oak slat on the warm grey wall. Tiles horizontally at 2 x the slat module. -->
  <defs>
    <filter id="g" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.28 0.0028" numOctaves="4" seed="5" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.30  0 0 0 0 0.15  0 0 0 0 0.06  1.25 0 0 0 -0.5"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0" stop-color="#FFEED0" stop-opacity=".42"/><stop offset=".2" stop-color="#FFEED0" stop-opacity="0"/>
      <stop offset=".72" stop-color="#3A1C0C" stop-opacity="0"/><stop offset="1" stop-color="#3A1C0C" stop-opacity=".34"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#28221E" stop-opacity=".32"/><stop offset="1" stop-color="#28221E" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="48" height="720" fill="#8C8B86"/>
  <rect x="20.6" width="8" height="720" fill="url(#sh)"/>
  <rect x="3.36" width="17.28" height="720" fill="#B2794C"/>
  <rect x="3.36" width="17.28" height="720" fill="#000" filter="url(#g)"/>
  <rect x="3.36" width="17.28" height="720" fill="url(#edge)"/>
  <circle cx="12" cy="300" r="2.2" fill="#4E2814" fill-opacity=".75"/>
  <circle cx="12" cy="300.8" r="2.6" fill="none" stroke="#FFE4BE" stroke-opacity=".3" stroke-width=".6"/>
</svg>
